<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birds — динамика и вектор</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --bg: #f3f5f8;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px 16px 48px;
  }
  .container { max-width: 1060px; margin: 0 auto; }

  /* ===== Шапка ===== */
  .site-header { margin-bottom: 20px; }
  .site-header h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .site-header .sub { color: var(--muted); font-size: .9rem; }
  .site-header .sub a { color: var(--accent); text-decoration: none; }
  .site-header .sub a:hover { text-decoration: underline; }

  /* ===== Панель настроек ===== */
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .05);
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span {
    font-size: .72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
  }
  select {
    font-size: .92rem;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    width: 100%;
  }
  select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  #stats {
    margin-top: 16px;
    padding: 10px 14px;
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: .92rem;
    font-weight: 600;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
  }
  #stats .dim { color: var(--muted); font-weight: 500; }

  /* ===== Графики ===== */
  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px 12px;
    margin-bottom: 20px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .05);
  }
  .chart-card h2 {
    font-size: 1rem;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .chart-card .cap { color: var(--muted); font-size: .8rem; margin: 0 0 8px; }
</style>
<base target="_blank">
</head>
<body>
<div class="container">

  <header class="site-header">
    <h1>Birds</h1>
    <div class="sub">Настройки и данные: <a href="https://docs.google.com/spreadsheets/d/1K1aSN9d0JA44ruQOIPh9fwgZlKsRBhSMqaK0KDzOtsw/edit?usp=sharing">GS</a></div>
  </header>

  <section class="panel">
    <div class="controls">
      <label class="field" title="Откат даты: посмотреть, как выглядел график в прошлом">
        <span>Срез на дату</span>
        <select id="dateSel"></select>
      </label>
      <label class="field">
        <span>Вид тренда</span>
        <select id="trendTypeSel">
          <option value="lin">Линейный</option>
          <option value="quad" selected>Квадратичный</option>
        </select>
      </label>
      <label class="field">
        <span>Сглаживание</span>
        <select id="smoothTypeSel">
          <option value="sma">Скользящее среднее</option>
          <option value="quad" selected>Квадратичная регрессия</option>
        </select>
      </label>
      <label class="field">
        <span>Окно сглаживания</span>
        <select id="winSel">
          <option value="7">7 дн.</option>
          <option value="14" selected>14 дн.</option>
          <option value="30">30 дн.</option>
        </select>
      </label>
    </div>
    <div id="stats">Загружаю данные из GS…</div>
  </section>

  <section class="chart-card">
    <h2 id="chartTitle">Динамика</h2>
    <p class="cap">Красная линия — сглаживание, зелёный пунктир — тренд за весь период. Ползунок под графиком — масштаб оси X.</p>
    <div id="chart"></div>
  </section>

  <section class="chart-card">
    <h2 id="vecTitle">Вектор</h2>
    <p class="cap">Изменение сглаженной линии за сутки, Птички/сутки. Зелёные столбики — рост, красные — снижение.</p>
    <div id="chartVec"></div>
  </section>

</div>

<script>
// ================= Настройки =================
const SHEET_ID = "1K1aSN9d0JA44ruQOIPh9fwgZlKsRBhSMqaK0KDzOtsw";
const SHEET_CSV = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
const RUBICON = "2026-08-13";

// ================= Чтение Google Sheets =================

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false;
      } else field += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ",") { row.push(field); field = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(field); field = "";
      if (row.length > 1 || row[0] !== "") rows.push(row);
      row = [];
    } else field += ch;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function normDate(s) {
  s = String(s).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/^(\d{1,2})[.](\d{1,2})[.](\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  return s;
}

async function loadData() {
  const resp = await fetch(SHEET_CSV);
  if (!resp.ok) throw new Error("таблица недоступна (код " + resp.status + ")");
  const rows = parseCSV(await resp.text());
  if (rows.length < 2) throw new Error("таблица пустая");

  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const d = normDate(rows[i][0] || "");
    const v = parseFloat(String(rows[i][1]).replace(/\s/g, "").replace(",", "."));
    if (/^\d{4}-\d{2}-\d{2}$/.test(d) && Number.isFinite(v)) out.push({ date: d, v });
  }
  if (out.length < 8) throw new Error("в таблице слишком мало данных (" + out.length + " строк)");
  out.sort((a, b) => a.date < b.date ? -1 : 1);
  return out;
}

// ================= Математика =================

// Скользящее среднее (первые w-1 значений — null)
function ma(arr, w) {
  const out = new Array(arr.length).fill(null);
  let s = 0;
  for (let i = 0; i < arr.length; i++) {
    s += arr[i];
    if (i >= w) s -= arr[i - w];
    if (i >= w - 1) out[i] = s / w;
  }
  return out;
}

// Решение системы 3x3 методом Гаусса
function solve3(A, b) {
  const M = A.map((row, i) => [...row, b[i]]);
  for (let col = 0; col < 3; col++) {
    let piv = col;
    for (let r = col + 1; r < 3; r++)
      if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
    [M[col], M[piv]] = [M[piv], M[col]];
    for (let r = 0; r < 3; r++) {
      if (r === col) continue;
      const f = M[r][col] / M[col][col];
      for (let c = col; c < 4; c++) M[r][c] -= f * M[col][c];
    }
  }
  return [M[0][3]/M[0][0], M[1][3]/M[1][1], M[2][3]/M[2][2]];
}

// Квадратичная регрессия y = A*t^2 + B*t + C с центрированием t = x - t0.
// Возвращает [A, B, C, t0].
function quadFit(y) {
  const n = y.length, t0 = (n - 1) / 2;
  let st=0, st2=0, st3=0, st4=0, sy=0, sty=0, st2y=0;
  for (let i = 0; i < n; i++) {
    const t = i - t0, yy = y[i];
    st += t; st2 += t*t; st3 += t*t*t; st4 += t*t*t*t;
    sy += yy; sty += t*yy; st2y += t*t*yy;
  }
  const A = [[st4, st3, st2], [st3, st2, st], [st2, st, n]];
  const [Aq, Bq, Cq] = solve3(A, [st2y, sty, sy]);
  return [Aq, Bq, Cq, t0];
}

// Линейная регрессия y = a*x + b; возвращает [a, b]
function linFit(y) {
  const n = y.length;
  let sx = 0, sy = 0, sxy = 0, sx2 = 0;
  for (let i = 0; i < n; i++) { sx += i; sy += y[i]; sxy += i * y[i]; sx2 += i * i; }
  const a = (n * sxy - sx * sy) / (n * sx2 - sx * sx);
  return [a, sy / n - a * sx / n];
}

// Сглаживание: "sma" — скользящее среднее, "quad" — скользящая квадратичная регрессия
// (значение дуги в правом крае окна). Первые w-1 значений — null.
function smooth(values, w, mode) {
  if (mode === "sma") return ma(values, w);
  const out = new Array(values.length).fill(null);
  for (let j = w - 1; j < values.length; j++) {
    const [Aq, Bq, Cq, t0] = quadFit(values.slice(j - w + 1, j + 1));
    const t = (w - 1) - t0;
    out[j] = Aq*t*t + Bq*t + Cq;
  }
  return out;
}

// Тренд скользящим окном по `win` днях (win = 0 — одна линия на весь ряд).
// mode: "lin" | "quad". Точка дня i — значение линии/параболы, построенной
// на окне [i-win+1, i], на правом крае окна. Линия непрерывная, без разрывов.
// Первые win-1 дней — null (окну не из чего собраться). endSlope — наклон в последний день.
function windowTrend(values, win, mode) {
  const ys = new Array(values.length).fill(null);
  let endSlope = null;
  if (win === 0) {          // весь период: одна линия на все дни
    if (values.length >= 5) {
      const n = values.length;
      if (mode === "quad") {
        const [Aq, Bq, Cq, t0] = quadFit(values);
        for (let t = 0; t < n; t++) { const tc = t - t0; ys[t] = Aq*tc*tc + Bq*tc + Cq; }
        endSlope = 2 * Aq * (n - 1 - t0) + Bq;
      } else {
        const [a, c] = linFit(values);
        for (let t = 0; t < n; t++) ys[t] = a * t + c;
        endSlope = a;
      }
    }
    return { ys, endSlope };
  }
  const W = win;
  for (let j = W - 1; j < values.length; j++) {
    const b = values.slice(j - W + 1, j + 1);
    if (b.length < 5) break;
    const n = b.length;
    if (mode === "quad") {
      const [Aq, Bq, Cq, t0] = quadFit(b);
      const t = n - 1 - t0;
      ys[j] = Aq*t*t + Bq*t + Cq;
      if (j === values.length - 1) endSlope = 2 * Aq * t + Bq;
    } else {
      const [a, c] = linFit(b);
      ys[j] = a * (n - 1) + c;
      if (j === values.length - 1) endSlope = a;
    }
  }
  return { ys, endSlope };
}

// ================= Отрисовка =================

async function main() {
  const data = await loadData();
  const dates  = data.map(r => r.date);
  const values = data.map(r => r.v);
  const N = dates.length;

  const sel = document.getElementById("dateSel");
  dates.forEach((d, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = d;
    if (i === N - 1) opt.selected = true;
    sel.appendChild(opt);
  });
  const trendTypeSel = document.getElementById("trendTypeSel");
  const smoothTypeSel = document.getElementById("smoothTypeSel");
  const winSel = document.getElementById("winSel");

  function draw(idx) {
      const trendMode = trendTypeSel.value;
    const smMode = smoothTypeSel.value;
    const w = +winSel.value;

    const sub = values.slice(0, idx + 1);
    const subDates = dates.slice(0, idx + 1);
    const sm = smooth(sub, w, smMode);
    const vec = sm.map((v, i) => (v === null || sm[i-1] === null) ? null : v - sm[i-1]);
    const tr = windowTrend(sub, 0, trendMode);

    const trendName = (trendMode === "quad" ? "Квадратичный тренд" : "Линейный тренд")
      + " (весь период)";
    const smName = (smMode === "quad" ? `Скользящая регрессия ${w} дн.` : `Скользящее среднее ${w} дн.`);

    const rubIdx = dates.indexOf(RUBICON);
    const shapes = (rubIdx >= 0 && rubIdx <= idx)
      ? [{ type: "line", x0: RUBICON, x1: RUBICON, y0: 0, y1: 1, yref: "paper",
           line: { dash: "dot", width: 2 } }] : [];

    document.getElementById("chartTitle").textContent = `Динамика · срез на ${dates[idx]}`;

    Plotly.react("chart", [
      { x: dates, y: values, mode: "markers", name: "Суточная сводка",
        marker: { size: 4, color: "#1f77b4" }, opacity: 0.55 },
      { x: subDates, y: sm, mode: "lines", name: smName,
        line: { color: "#d62728", width: 3 }, connectgaps: false },
      { x: subDates, y: tr.ys,
        mode: "lines", name: trendName,
        line: { color: "#2ca02c", width: 2, dash: "dash" }, connectgaps: false }
    ], {
      xaxis: { title: "Дата окончания оперативного окна", rangeslider: {} },
      yaxis: { title: "Птички за 24-часовое окно" },
      hovermode: "x unified",
      legend: { orientation: "h", y: 1.18, x: 0 },
      shapes,
      margin: { t: 30, r: 20, b: 0, l: 60 },
      height: 500
    }, { responsive: true, displaylogo: false });

    Plotly.react("chartVec", [{
      x: subDates, y: vec, type: "bar",
      marker: { color: vec.map(v => v === null ? "#999" : (v >= 0 ? "#2ca02c" : "#d62728")) },
      name: "Вектор"
    }], {
      yaxis: { title: "Вектор, Птички/сутки" },
      showlegend: false,
      margin: { t: 10, r: 20, b: 40, l: 60 },
      height: 220
    }, { responsive: true, displaylogo: false });

    const lvl = sm[idx], v = vec[idx];
    let text = lvl === null ? "Недостаточно данных для сглаживания"
      : `<span>Уровень: ${lvl.toFixed(0)}</span>`;
    if (v !== null && v !== undefined)
      text += `<span class="dim">Вектор: ${v >= 0 ? "+" : ""}${v.toFixed(1)}</span>`;
    if (tr.endSlope !== null)
      text += `<span class="dim">Тренд: ${tr.endSlope >= 0 ? "+" : ""}${tr.endSlope.toFixed(1)}/сутки</span>`;
    document.getElementById("stats").innerHTML = text;
  }

  [sel, trendTypeSel, smoothTypeSel, winSel].forEach(el =>
    el.addEventListener("change", () => draw(+sel.value)));
  draw(N - 1);
}

main().catch(e => {
  document.getElementById("stats").textContent =
    "Ошибка загрузки данных: " + e.message +
    " — проверьте, что в таблице включён доступ «все, у кого есть ссылка → читатель».";
});
</script>
</body>
</html>
