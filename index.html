<div class="sub">Настройки и данные: <a href="https://docs.google.com/spreadsheets/d/1K1aSN9d0JA44ruQOIPh9fwgZlKsRBhSMqaK0KDzOtsw/edit?usp=sharing">GS</a></div>

<script>
// ================= Настройки =================
const SHEET_ID = "1K1aSN9d0JA44ruQOIPh9fwgZlKsRBhSMqaK0KDzOtsw";
const SHEET_CSV = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
const RUBICON = "2026-08-13";
const SCALE_NAMES = { 7: "неделя", 14: "2 недели", 30: "месяц", 0: "весь период" };

// Параметры модели прогноза
const PEAK_SIGMA = 1.5;  // порог «истинного пика»: вектор > μ + 1.5σ
const RIDGE = 1.0;       // регуляризация (защита от переобучения)
const TRAIN_MAX = 365;   // максимальный lookback обучения, дней
const MIN_TRAIN = 30;    // минимум истории для обучения
const N_NEWTON = 40;     // итерации обучения

// ================= Чтение Google Sheets =================

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false;
      } else field += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ",") { row.push(field); field = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(field); field = "";
      if (row.length > 1 || row[0] !== "") rows.push(row);
      row = [];
    } else field += ch;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function normDate(s) {
  s = String(s).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/^(\d{1,2})[.](\d{1,2})[.](\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  return s;
}

async function loadData() {
  const resp = await fetch(SHEET_CSV);
  if (!resp.ok) throw new Error("таблица недоступна (код " + resp.status + ")");
  const rows = parseCSV(await resp.text());
  if (rows.length < 2) throw new Error("таблица пустая");

  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const d = normDate(rows[i][0] || "");
    const v = parseFloat(String(rows[i][1]).replace(/\s/g, "").replace(",", "."));
    if (/^\d{4}-\d{2}-\d{2}$/.test(d) && Number.isFinite(v)) out.push({ date: d, v });
  }
  if (out.length < 8) throw new Error("в таблице слишком мало данных (" + out.length + " строк)");
  out.sort((a, b) => a.date < b.date ? -1 : 1);
  return out;
}

// ================= Математика =================

// Скользящее среднее (первые w-1 значений — null)
function ma(arr, w) {
  const out = new Array(arr.length).fill(null);
  let s = 0;
  for (let i = 0; i < arr.length; i++) {
    s += arr[i];
    if (i >= w) s -= arr[i - w];
    if (i >= w - 1) out[i] = s / w;
  }
  return out;
}

// Решение системы 3x3 методом Гаусса
function solve3(A, b) {
  const M = A.map((row, i) => [...row, b[i]]);
  for (let col = 0; col < 3; col++) {
    let piv = col;
    for (let r = col + 1; r < 3; r++)
      if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
    [M[col], M[piv]] = [M[piv], M[col]];
    for (let r = 0; r < 3; r++) {
      if (r === col) continue;
      const f = M[r][col] / M[col][col];
      for (let c = col; c < 4; c++) M[r][c] -= f * M[col][c];
    }
  }
  return [M[0][3]/M[0][0], M[1][3]/M[1][1], M[2][3]/M[2][2]];
}

// Квадратичная регрессия y = A*t^2 + B*t + C с центрированием t = x - t0.
// Возвращает [A, B, C, t0].
function quadFit(y) {
  const n = y.length, t0 = (n - 1) / 2;
  let st=0, st2=0, st3=0, st4=0, sy=0, sty=0, st2y=0;
  for (let i = 0; i < n; i++) {
    const t = i - t0, yy = y[i];
    st += t; st2 += t*t; st3 += t*t*t; st4 += t*t*t*t;
    sy += yy; sty += t*yy; st2y += t*t*yy;
  }
  const A = [[st4, st3, st2], [st3, st2, st], [st2, st, n]];
  const [Aq, Bq, Cq] = solve3(A, [st2y, sty, sy]);
  return [Aq, Bq, Cq, t0];
}

// Линейная регрессия y = a*x + b; возвращает [a, b]
function linFit(y) {
  const n = y.length;
  let sx = 0, sy = 0, sxy = 0, sx2 = 0;
  for (let i = 0; i < n; i++) { sx += i; sy += y[i]; sxy += i * y[i]; sx2 += i * i; }
  const a = (n * sxy - sx * sy) / (n * sx2 - sx * sx);
  return [a, sy / n - a * sx / n];
}

// Сглаживание: "sma" — скользящее среднее, "quad" — скользящая квадратичная регрессия
// (значение дуги в правом крае окна). Первые w-1 значений — null.
function smooth(values, w, mode) {
  if (mode === "sma") return ma(values, w);
  const out = new Array(values.length).fill(null);
  for (let j = w - 1; j < values.length; j++) {
    const [Aq, Bq, Cq, t0] = quadFit(values.slice(j - w + 1, j + 1));
    const t = (w - 1) - t0;
    out[j] = Aq*t*t + Bq*t + Cq;
  }
  return out;
}

// Тренды блоками по `block` дней (block = 0 — один блок на весь ряд).
// mode: "lin" | "quad". Возвращает линии и наклон в конце последнего блока.
function blockTrends(values, block, mode) {
  const size = block === 0 ? values.length : block;
  const xs = [], ys = [];
  let endSlope = null;
  for (let start = 0; start < values.length; start += size) {
    const b = values.slice(start, start + size);
    if (b.length < 5) break;
    const n = b.length;
    if (mode === "quad") {
      const [Aq, Bq, Cq, t0] = quadFit(b);
      for (let t = 0; t < n; t++) {
        const tc = t - t0;
        xs.push(start + t);
        ys.push(Aq*tc*tc + Bq*tc + Cq);
      }
      endSlope = 2 * Aq * (n - 1 - t0) + Bq;
    } else {
      const [a, c] = linFit(b);
      for (let t = 0; t < n; t++) { xs.push(start + t); ys.push(a * t + c); }
      endSlope = a;
    }
    xs.push(null); ys.push(null);
  }
  return { xs, ys, endSlope };
}

// ================= Модель прогноза пика (логистическая регрессия) =================

function sigmoid(z) { return 1 / (1 + Math.exp(-z)); }

function meanStd(a) {
  const m = a.reduce((s, x) => s + x, 0) / a.length;
  const v = a.reduce((s, x) => s + (x - m) * (x - m), 0) / Math.max(1, a.length - 1);
  return [m, Math.sqrt(v)];
}

// Решение системы n×n методом Гаусса
function solveN(A, b) {
  const n = b.length;
  const M = A.map((row, i) => [...row, b[i]]);
  for (let col = 0; col < n; col++) {
    let piv = col;
    for (let r = col + 1; r < n; r++)
      if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
    [M[col], M[piv]] = [M[piv], M[col]];
    const d = M[col][col];
    if (Math.abs(d) < 1e-12) return null;
    for (let c = col; c <= n; c++) M[col][c] /= d;
    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const f = M[r][col];
      for (let c = col; c <= n; c++) M[r][c] -= f * M[col][c];
    }
  }
  return M.map(row => row[n]);
}

// Обучение логистической регрессии (Ньютон-Рафсон с ridge-регуляризацией).
// X — строки вида [1, x1, ..., xp], y — 0/1.
function trainLogistic(X, y) {
  const p = X[0].length, m = X.length;
  const beta = new Array(p).fill(0);
  for (let it = 0; it < N_NEWTON; it++) {
    const H = Array.from({ length: p }, () => new Array(p).fill(0));
    const g = new Array(p).fill(0);
    for (let i = 0; i < m; i++) {
      let z = 0;
      for (let j = 0; j < p; j++) z += X[i][j] * beta[j];
      const pr = sigmoid(z);
      const w = Math.max(pr * (1 - pr), 1e-6);
      for (let a = 0; a < p; a++) {
        g[a] += X[i][a] * (y[i] - pr);
        const xa = X[i][a];
        for (let b = a; b < p; b++) H[a][b] += w * xa * X[i][b];
      }
    }
    for (let a = 0; a < p; a++) {
      for (let b = 0; b < a; b++) H[a][b] = H[b][a];
      H[a][a] += RIDGE;
      g[a] -= RIDGE * beta[a];
    }
    const step = solveN(H, g);
    if (!step) break;
    let norm = 0;
    for (let a = 0; a < p; a++) { beta[a] += step[a]; norm += step[a] * step[a]; }
    if (norm < 1e-10) break;
  }
  return beta;
}

// Наклон блокового тренда в конкретный день i (тот же тренд, что на графике)
function blockSlopeAt(values, i, block, mode) {
  if (block === 0) {
    if (values.length < 5) return null;
    if (mode === "quad") {
      const [Aq, Bq, , t0] = quadFit(values);
      return 2 * Aq * (i - t0) + Bq;
    }
    return linFit(values)[0];
  }
  const start = Math.floor(i / block) * block;
  const b = values.slice(start, start + block);
  if (b.length < 5) return null;
  if (mode === "quad") {
    const [Aq, Bq, , t0] = quadFit(b);
    return 2 * Aq * (i - start - t0) + Bq;
  }
  return linFit(b)[0];
}

// Построение обучающих строк: признаки дня i + целевая переменная (пик на i+1)
function buildModelRows(values, dates, w, smMode, scale, trendMode) {
  const sm = smooth(values, w, smMode);
  const vec = sm.map((v, i) => (v === null || sm[i-1] === null) ? null : v - sm[i-1]);
  const vv = vec.filter(v => v !== null);
  if (vv.length < 20) return null;
  const [mu, sd] = meanStd(vv);
  const thr = mu + PEAK_SIGMA * sd;
  const slope = values.map((_, i) => blockSlopeAt(values, i, scale, trendMode));

  const rows = [];
  for (let i = 0; i < values.length; i++) {
    if (vec[i] === null || vec[i-1] === null) continue;
    if (slope[i] === null || slope[i-1] === null) continue;
    let s = 0, c = 0;
    for (const k of [i-2, i-1, i])
      if (k >= 0 && vec[k] !== null) { s += Math.min(0, vec[k]); c++; }
    const damp = c ? -s / c : 0;                       // «пружина»: сжатие за 3 дня
    const dow = new Date(dates[i] + "T12:00:00").getDay();
    const ang = 2 * Math.PI * dow / 7;
    let y = null;
    if (i + 1 < values.length && vec[i+1] !== null)
      y = vec[i+1] > thr ? 1 : 0;
    rows.push({ i, x: [vec[i], slope[i] - slope[i-1], damp, Math.sin(ang), Math.cos(ang)], y });
  }
  return { rows, mu, sd, thr };
}

// Обучение на строках с известным y (последние TRAIN_MAX), предсказание для xToday
function fitPredict(trainRows, xToday) {
  const train = trainRows.slice(-TRAIN_MAX);
  if (train.length < MIN_TRAIN) return null;
  const p = xToday.length;
  const mu = new Array(p), sd = new Array(p);
  for (let j = 0; j < p; j++) {
    const [m, s] = meanStd(train.map(r => r.x[j]));
    mu[j] = m; sd[j] = s > 1e-9 ? s : 1;
  }
  const X = train.map(r => [1, ...r.x.map((v, j) => (v - mu[j]) / sd[j])]);
  const beta = trainLogistic(X, train.map(r => r.y));
  let z = beta[0];
  for (let j = 0; j < p; j++) z += beta[j+1] * (xToday[j] - mu[j]) / sd[j];
  return { p: sigmoid(z), n: train.length };
}

function probLabel(p) {
  if (p < 0.25) return ["низкая", "c-low", "b-low"];
  if (p < 0.50) return ["умеренная", "c-mid", "b-mid"];
  if (p < 0.75) return ["повышенная", "c-high", "b-high"];
  return ["высокая", "c-vhigh", "b-vhigh"];
}

function addDays(dateStr, k) {
  const d = new Date(dateStr + "T12:00:00");
  d.setDate(d.getDate() + k);
  return d.toISOString().slice(0, 10);
}

// ================= Отрисовка =================

async function main() {
  const data = await loadData();
  const dates  = data.map(r => r.date);
  const values = data.map(r => r.v);
  const N = dates.length;

  const sel = document.getElementById("dateSel");
  dates.forEach((d, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = d;
    if (i === N - 1) opt.selected = true;
    sel.appendChild(opt);
  });
  const scaleSel = document.getElementById("scaleSel");
  const trendTypeSel = document.getElementById("trendTypeSel");
  const smoothTypeSel = document.getElementById("smoothTypeSel");
  const winSel = document.getElementById("winSel");

  function draw(idx) {
    const scale = +scaleSel.value;
    const trendMode = trendTypeSel.value;
    const smMode = smoothTypeSel.value;
    const w = +winSel.value;

    const sub = values.slice(0, idx + 1);
    const subDates = dates.slice(0, idx + 1);
    const sm = smooth(sub, w, smMode);
    const vec = sm.map((v, i) => (v === null || sm[i-1] === null) ? null : v - sm[i-1]);
    const tr = blockTrends(sub, scale, trendMode);

    const trendName = (trendMode === "quad" ? "Квадратичный тренд" : "Линейный тренд")
      + ` (${SCALE_NAMES[scale]})`;
    const smName = (smMode === "quad" ? `Скользящая регрессия ${w} дн.` : `Скользящее среднее ${w} дн.`);

    const rubIdx = dates.indexOf(RUBICON);
    const shapes = (rubIdx >= 0 && rubIdx <= idx)
      ? [{ type: "line", x0: RUBICON, x1: RUBICON, y0: 0, y1: 1, yref: "paper",
           line: { dash: "dot", width: 2 } }] : [];

    Plotly.react("chart", [
      { x: dates, y: values, mode: "markers", name: "Суточная сводка",
        marker: { size: 4, color: "#1f77b4" }, opacity: 0.55 },
      { x: subDates, y: sm, mode: "lines", name: smName,
        line: { color: "#d62728", width: 3 }, connectgaps: false },
      { x: tr.xs.map(i => i === null ? null : subDates[i]), y: tr.ys,
        mode: "lines", name: trendName,
        line: { color: "#2ca02c", width: 2, dash: "dash" }, connectgaps: false }
    ], {
      title: { text: `Срез на ${dates[idx]}` },
      xaxis: { title: "Дата окончания оперативного окна", rangeslider: {} },
      yaxis: { title: "24-часовое окно" },
      hovermode: "x unified",
      legend: { orientation: "h", y: 1.14 },
      shapes,
      margin: { t: 60 },
      height: 500
    }, { responsive: true, displaylogo: false });

    Plotly.react("chartVec", [{
      x: subDates, y: vec, type: "bar",
      marker: { color: vec.map(v => v === null ? "#999" : (v >= 0 ? "#2ca02c" : "#d62728")) },
      name: "Вектор"
    }], {
      yaxis: { title: "Вектор, Птички/сутки" },
      showlegend: false,
      margin: { t: 10 },
      height: 220
    }, { responsive: true, displaylogo: false });

    // ---------- Прогноз пика ----------
    const model = buildModelRows(sub, subDates, w, smMode, scale, trendMode);
    const fc = document.getElementById("forecast");
    const probX = [], probY = [];

    if (!model || model.rows.length === 0) {
      fc.style.display = "block";
      fc.innerHTML = `<div class="lab">Прогноз пика</div>
        <div class="meta">Недостаточно истории для обучения модели (нужно ≥ ${MIN_TRAIN} дней).</div>`;
    } else {
      // out-of-sample: каждая точка предсказана моделью, обученной только на прошлом
      for (let r = 0; r < model.rows.length; r++) {
        const prev = [];
        for (let q = 0; q < r; q++)
          if (model.rows[q].y !== null) prev.push(model.rows[q]);
        const fp = fitPredict(prev, model.rows[r].x);
        if (fp) { probX.push(subDates[model.rows[r].i]); probY.push(100 * fp.p); }
      }

      const today = model.rows[model.rows.length - 1];
      const hist = model.rows.filter(r => r.y !== null);
      const fpT = fitPredict(hist, today.x);

      if (!fpT) {
        fc.style.display = "block";
        fc.innerHTML = `<div class="lab">Прогноз пика</div>
          <div class="meta">Накоплено ${hist.length} обучающих дней — модели нужно ≥ ${MIN_TRAIN}. Продолжайте вести таблицу.</div>`;
      } else {
        const pct = 100 * fpT.p;
        const [label, cls, bcls] = probLabel(fpT.p);
        const d1 = addDays(dates[idx], 1), d2 = addDays(dates[idx], 2);
        fc.style.display = "block";
        fc.innerHTML = `
          <div class="lab">Вероятность увеличения интенсивности (${d1} → ${d2})</div>
          <div class="big ${cls}">${pct.toFixed(0)}% <span class="qual">— ${label}</span></div>
          <div class="bar"><div class="${bcls}" style="width:${Math.max(2, pct).toFixed(0)}%"></div></div>
          `;
      }

      const tomorrowP = fpT ? 100 * fpT.p : null;
      const traces = [
        { x: probX, y: probY, mode: "lines", name: "P(пик завтра), out-of-sample",
          line: { color: "#9467bd", width: 2 } },
        { x: [dates[idx]], y: [tomorrowP], mode: "markers",
          name: "Прогноз на следующее окно",
          marker: { size: 12, symbol: "star", color: "#d62728" } }
      ];
      Plotly.react("chartProb", traces, {
        title: { text: "График вероятности" },
        yaxis: { title: "Вероятность, %", range: [0, 100] },
        shapes: [
          { type: "line", x0: probX[0], x1: dates[idx], y0: 50, y1: 50,
            line: { dash: "dot", color: "#888" } },
          ...shapes
        ],
        showlegend: false,
        margin: { t: 50 },
        height: 260
      }, { responsive: true, displaylogo: false });
    }

    const lvl = sm[idx], v = vec[idx];
    let text = lvl === null ? "Недостаточно данных для сглаживания"
      : `Уровень: ${lvl.toFixed(0)} ··· Вектор: ${v >= 0 ? "+" : ""}${v.toFixed(1)}`;
    if (tr.endSlope !== null)
      text += ` ··· Тренд: ${tr.endSlope >= 0 ? "+" : ""}${tr.endSlope.toFixed(1)}`;
    document.getElementById("stats").textContent = text;
  }

  [sel, scaleSel, trendTypeSel, smoothTypeSel, winSel].forEach(el =>
    el.addEventListener("change", () => draw(+sel.value)));
  draw(N - 1);
}

main().catch(e => {
  document.getElementById("stats").textContent =
    "Ошибка загрузки данных: " + e.message +
    " — проверьте, что в таблице включён доступ «все, у кого есть ссылка → читатель».";
});
</script>
</body>
</html>
